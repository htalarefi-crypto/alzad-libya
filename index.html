<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزاد | السوق الليبي الشامل</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="bg-emerald-600 text-white font-black text-xl px-3 py-1.5 rounded-xl shadow-md">الزاد</span>
                <h1 class="text-xl font-bold text-white">السوق الليبي الشامل</h1>
            </div>
            <div>
                <a href="#add-item" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-xl transition shadow-sm text-sm">
                    + أضف إعلانك
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Hero Section -->
        <section class="bg-gradient-to-br from-emerald-950 to-teal-900 text-white py-10 px-4 text-center rounded-2xl shadow-inner border border-slate-800 mb-8">
            <div class="max-w-3xl mx-auto">
                <h2 class="text-2xl md:text-3xl font-black mb-3 tracking-wide text-white">منصة الزاد لكل احتياجاتك في ليبيا</h2>
                <p class="text-emerald-200 text-sm md:text-base mb-6 font-medium">بيع، اشتري، وتصفح أفضل السلع والخدمات بكل سهولة وأمان.</p>
                <div class="relative max-w-xl mx-auto">
                    <input type="text" placeholder="ابحث عما تبحث عنه (سيارات، عقارات، إلكترونيات...)" class="w-full py-3 px-4 pr-12 rounded-2xl text-white bg-slate-800 placeholder-gray-400 border border-slate-700 focus:outline-none focus:ring-4 focus:ring-emerald-500 shadow-lg text-sm font-medium">
                    <span class="absolute top-3.5 right-4 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                </div>
            </div>
        </section>

        <!-- Admin Section (Protected Area with Password & Recovery Options) -->
        <section class="max-w-md mx-auto bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 my-8">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-slate-900 mx-auto flex items-center justify-center rounded-2xl mb-3 border border-slate-700 text-emerald-400 shadow-inner">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-white mb-1">منطقة الإدارة المحمية</h3>
                <p class="text-gray-300 text-sm">مخصصة لمالك المنصة. أدخل رمز الدخول للتحكم.</p>
            </div>
            
            <div class="space-y-4">
                <input type="password" id="admin-pass" placeholder="أدخل كلمة سر الإدارة" class="w-full py-3 px-4 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-center font-medium">
                
                <!-- Fixed Visible Button -->
                <button onclick="alert('تم تسجيل الدخول بنجاح')" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition">
                    فتح لوحة الإدارة
                </button>

                <!-- Password Recovery & Change Options -->
                <div class="flex justify-between items-center text-xs text-gray-400 pt-2 px-1">
                    <button onclick="alert('سيتم إرسال تعليمات استعادة كلمة المرور إلى البريد المرتبط بالنظام.')" class="hover:text-emerald-400 transition underline">
                        نسيت كلمة السر؟
                    </button>
                    <button onclick="alert('خاصية تغيير كلمة المرور مفعلة. يمكنك تحديثها عبر لوحة التحكم بعد الدخول.')" class="hover:text-emerald-400 transition underline">
                        تغيير كلمة المرور
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 text-gray-400 py-6 text-center text-sm font-medium">
        <p>&copy; 2026 منصة الزاد - السوق الليبي الشامل. جميع الحقوق محفوظة.</p>
    </footer>

        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBBIezRyQBATzZ2qe...",

            storageBucket: "alzad-libya.appspot.com",
            messagingSenderId: "220368156868",
            appId: "1:220368156868:web:534917"
        };
        initializeApp(firebaseConfig);
    </script>
</body>
</html>
